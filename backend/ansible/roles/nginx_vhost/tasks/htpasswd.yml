---
# Nothing about the HTTP authentication is stored in the dropfactory database :
# the presence of the htpasswd file is what tells whether a site is protected.
# This file is therefore included before every vhost rendering, so a task that
# carries no credential (a rename, an alias change) keeps the site as it was.

- name: Create the nginx htpasswd directory
  ansible.builtin.file:
    path: "{{ dropfactory_site_htpasswd_dir }}"
    state: directory
    owner: root
    group: www-data
    mode: "0750"
  tags:
    - nginx_vhost

# The hash is computed by the dropfactory backend, the clear text password
# never reaches the server.
- name: Write the site htpasswd file
  ansible.builtin.copy:
    content: "{{ dropfactory_site_htpasswd_username }}:{{ dropfactory_site_htpasswd_hash }}\n"
    dest: "{{ dropfactory_site_htpasswd_file }}"
    owner: root
    group: www-data
    mode: "0640"
  no_log: true
  when:
    - dropfactory_site_htpasswd_username | length > 0
    - dropfactory_site_htpasswd_hash | length > 0
  tags:
    - nginx_vhost

- name: Check whether the site is protected by HTTP authentication
  ansible.builtin.stat:
    path: "{{ dropfactory_site_htpasswd_file }}"
  register: dropfactory_site_htpasswd_stat
  tags:
    - nginx_vhost
